name: Static Site Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts
        run: bash -n serve-redesign.command
      - name: Block mixed-content asset URLs
        run: |
          if grep -RInE '(src|href)="http://' --include='*.html' --include='*.js' --include='*.css' .; then
            echo 'Insecure HTTP asset URL detected.' >&2
            exit 1
          fi
      - name: Verify the static site responds
        run: |
          python3 -m http.server 4173 >/tmp/garibaldina-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/garibaldina-site.log >&2
          exit 1
